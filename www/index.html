<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>OpenHands 远程</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111b2e; --line:#22314d; --fg:#e6edf7;
    --dim:#8fa3bf; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",sans-serif;
    padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
    overflow-y:auto;
  }
  h1{font-size:21px;margin:6px 0 8px}
  h2{font-size:12px;color:var(--dim);margin:28px 0 10px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase}
  .hint{color:var(--dim);font-size:13px;margin:0 0 22px}
  .field{display:block;margin-bottom:12px}
  .field span{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  input{
    width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);
    background:#0d1729;color:var(--fg);font-size:16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  input:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;margin-top:8px}
  button{border-radius:10px;border:1px solid var(--line);font-size:15px;padding:13px 16px;
    background:#17223a;color:var(--fg);font-family:inherit}
  button.primary{flex:1 1 auto;background:var(--accent);border-color:var(--accent);
    color:#fff;font-weight:600}
  button.ghost{flex:0 0 auto;color:var(--dim)}
  button:active{opacity:.75}
  button:disabled{opacity:.45}
  .status{margin-top:14px;font-size:13px;color:var(--dim);min-height:20px;word-break:break-all}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)} .status.busy{color:var(--warn)}
  .profiles{list-style:none;margin:0;padding:0}
  .profiles li{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:10px}
  .profiles .top{display:flex;align-items:center;gap:10px}
  .profiles .u{flex:1 1 auto;min-width:0}
  .profiles .u b{display:block;font-size:15px;font-weight:600}
  .profiles .u small{color:var(--dim);font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  .profiles .acts{display:flex;gap:8px;margin-top:12px}
  .profiles .acts button{flex:1 1 0;padding:10px;font-size:14px}
  .profiles button.del{flex:0 0 auto;color:var(--err)}
  .empty{color:var(--dim);font-size:13px}
  .scanlist{list-style:none;margin:10px 0 0;padding:0}
  .scanlist li{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .scanlist code{flex:1 1 auto;font-size:13px}
  .scanlist button{padding:8px 14px;font-size:13px}
</style>
</head>
<body>

<h1>连接电脑</h1>
<p class="hint">电脑上跑着 agent-canvas 才能连。换了 WiFi 地址会变——改一下，或点「扫描」自动找。</p>

<label class="field">
  <span>电脑地址</span>
  <input id="inUrl" inputmode="url" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false" placeholder="192.168.0.100:8000">
</label>

<div class="row">
  <button id="btnConnect" class="primary">连接</button>
  <button id="btnScan" class="ghost">扫描</button>
</div>

<div id="status" class="status"></div>
<div id="scanBox"></div>

<h2>已保存</h2>
<ul id="profiles" class="profiles"></ul>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var KEYS = { profiles: 'oh_profiles', last: 'oh_last' };
  var busy = false;

  function status(msg, cls) {
    var el = $('#status');
    el.textContent = msg || '';
    el.className = 'status' + (cls ? ' ' + cls : '');
  }

  function getProfiles() {
    try {
      var v = JSON.parse(localStorage.getItem(KEYS.profiles) || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function setProfiles(list) {
    localStorage.setItem(KEYS.profiles, JSON.stringify(list.slice(0, 12)));
  }

  // "192.168.1.5" | "192.168.1.5:8000" | "http://h:port/" | "h"
  // agent-canvas serves plain http on 8000, so that is the default for http;
  // https means a TLS front end (tailscale serve etc.) on the standard port.
  // origin is used rather than rebuilding host:port because the URL spec
  // normalises the https default port away, which would leave a dangling ":".
  function normUrl(input) {
    var v = String(input || '').trim();
    if (!v) return '';
    if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
    try {
      var u = new URL(v);
      if (!u.port) u.port = u.protocol === 'https:' ? '443' : '8000';
      return u.origin;
    } catch (e) { return ''; }
  }
  function hostOf(url) { try { return new URL(url).hostname; } catch (e) { return url; } }

  // The response is opaque under no-cors, but a resolved promise proves a TCP
  // port accepted us, which is all we need to tell "there" from "not there".
  function probe(url, ms) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, ms || 2500);
    return fetch(url + '/', { mode: 'no-cors', cache: 'no-store', signal: ctl.signal })
      .then(function () { return true; })
      .catch(function () { return false; })
      .then(function (ok) { clearTimeout(timer); return ok; });
  }

  function remember(url) {
    var list = getProfiles().filter(function (p) { return p.url !== url; });
    list.unshift({ url: url, name: hostOf(url), at: Date.now() });
    setProfiles(list);
    localStorage.setItem(KEYS.last, url);
  }

  function open(url) {
    var target = normUrl(url);
    if (!target) { status('地址格式不对', 'err'); return Promise.resolve(false); }
    if (busy) return Promise.resolve(false);
    busy = true;
    $('#inUrl').value = target;
    $('#btnConnect').disabled = true;
    status('正在连接 ' + target, 'busy');

    return probe(target).then(function (ok) {
      busy = false;
      $('#btnConnect').disabled = false;
      if (!ok) {
        status('连不上 ' + target + '　检查电脑、agent-canvas、地址、同一 WiFi', 'err');
        return false;
      }
      remember(target);
      renderProfiles();
      status('已连上，正在打开…', 'ok');
      // Top-level navigation instead of an iframe: the desktop UI then keeps
      // its own origin, so its storage and service worker behave normally.
      location.href = target + '/';
      return true;
    });
  }

  function renderProfiles() {
    var ul = $('#profiles');
    var list = getProfiles();
    ul.innerHTML = '';
    if (!list.length) {
      ul.innerHTML = '<li class="empty">还没有保存的地址</li>';
      return;
    }
    list.forEach(function (p) {
      var li = document.createElement('li');

      var top = document.createElement('div');
      top.className = 'top';
      var u = document.createElement('div');
      u.className = 'u';
      var b = document.createElement('b');
      b.textContent = p.name || hostOf(p.url);
      var small = document.createElement('small');
      small.textContent = p.url;
      u.appendChild(b);
      u.appendChild(small);
      top.appendChild(u);
      li.appendChild(top);

      var acts = document.createElement('div');
      acts.className = 'acts';

      var go = document.createElement('button');
      go.textContent = '连接';
      go.onclick = function () { open(p.url); };

      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '删除';
      del.onclick = function () {
        setProfiles(getProfiles().filter(function (x) { return x.url !== p.url; }));
        renderProfiles();
      };

      acts.appendChild(go);
      acts.appendChild(del);
      li.appendChild(acts);
      ul.appendChild(li);
    });
  }

  function scan() {
    var src = normUrl($('#inUrl').value) || localStorage.getItem(KEYS.last) || 'http://192.168.0.1:8000';
    var u;
    try { u = new URL(src); } catch (e) { status('先填个参考地址，比如 192.168.0.100', 'err'); return; }

    var parts = u.hostname.split('.');
    if (parts.length !== 4) { status('只支持 IPv4 地址', 'err'); return; }
    var base = parts.slice(0, 3).join('.') + '.';
    var scheme = u.protocol === 'https:' ? 'https' : 'http';
    var port = u.port || (scheme === 'https' ? '443' : '8000');

    var box = $('#scanBox');
    var found = [];
    var done = 0;
    var total = 254;
    var queue = [];
    for (var i = 1; i <= 254; i++) queue.push(base + i);

    function render() {
      var html = '';
      if (found.length) {
        html += '<ul class="scanlist">';
        found.forEach(function (f) {
          html += '<li><code>' + f + '</code><button data-u="' + f + '">连接</button></li>';
        });
        html += '</ul>';
      }
      box.innerHTML = html;
      Array.prototype.forEach.call(box.querySelectorAll('button[data-u]'), function (btn) {
        btn.onclick = function () { open(btn.getAttribute('data-u')); };
      });
      status('扫描 ' + base + '1-254:' + port + '　' + done + '/' + total + '　找到 ' + found.length, 'busy');
    }
    render();

    var CONC = 24;
    function next() {
      if (!queue.length) return Promise.resolve();
      var h = queue.shift();
      return probe(scheme + '://' + h + ':' + port, 900).then(function (ok) {
        done++;
        if (ok) found.push(scheme + '://' + h + ':' + port);
        if (ok || done % 16 === 0) render();
        return next();
      });
    }

    var runners = [];
    for (var k = 0; k < CONC; k++) runners.push(next());

    Promise.all(runners).then(function () {
      if (!found.length) {
        status('没找到。确认手机和电脑同一个 WiFi，且电脑是 --host 0.0.0.0 启动的。', 'err');
      } else if (found.length === 1) {
        open(found[0]);
      } else {
        render();
        status('找到 ' + found.length + ' 个，选一个', 'ok');
      }
    });
  }

  $('#btnConnect').onclick = function () { open($('#inUrl').value); };
  $('#btnScan').onclick = scan;
  $('#inUrl').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); open($('#inUrl').value); }
  });

  var last = localStorage.getItem(KEYS.last);
  if (last) $('#inUrl').value = last;
  renderProfiles();

  // Restored address: probe before navigating. Jumping straight in would strand
  // the user on a browser error page with no way back to this setup screen,
  // which is exactly what happens after switching WiFi.
  if (last) {
    var target = normUrl(last);
    if (target) {
      status('正在打开上次的地址 ' + target, 'busy');
      probe(target, 2000).then(function (ok) {
        if (ok) {
          location.href = target + '/';
        } else {
          $('#inUrl').value = target;
          status('上次的 ' + target + ' 连不上，多半是换了 WiFi。改地址或点「扫描」。', 'err');
        }
      });
    }
  }
})();
</script>
</body>
</html>

name: 构建 iOS 安装包

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

# 同一个分支只跑最新一次，避免旧的排队任务堆积
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    # Intel(x64) 免费标准机，用来避开 arm64 标准机的排队。
    # 可替换：macos-26-intel（Xcode 26）/ macos-15（arm64）/ macos-26（arm64）。
    # 注意 macos-13、macos-14 都已在 2025-12-04 / 2026-11-02 退役，用它们只会一直排队。
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 不再用 setup-xcode 拉 latest-stable：那个值会随时间漂移，最新的 Xcode 27
      # 要 macOS 27，装在 macos-15 镜像上会直接失败。下面直接用镜像自带的 Xcode。
      - name: 确认 Xcode 版本
        run: xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 生成 iOS 原生工程
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi

      - name: 同步网页资源
        run: npx cap sync ios

      - name: 生成 App 图标
        run: |
          if ! npx --no-install @capacitor/assets generate --ios \
            --iconBackgroundColor "#0B1220" \
            --iconBackgroundColorDark "#0B1220" \
            --splashBackgroundColor "#0B1220" \
            --splashBackgroundColorDark "#0B1220"; then
            echo "::warning::图标生成失败，本次使用 Capacitor 默认图标"
          fi
          echo "--- 打进包的图标 ---"
          find ios/App/App/Assets.xcassets -name '*.png' | head -n 8

      - name: 设置中文显示名
        run: |
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleDisplayName OpenHands" ios/App/App/Info.plist || \
          $PB -c "Add :CFBundleDisplayName string OpenHands" ios/App/App/Info.plist

      # The shell loads the desktop UI over plain http:// on the LAN, and iOS
      # blocks cleartext HTTP by default (ATS). These exceptions are what make
      # an otherwise-valid connection fail with no usable error.
      - name: 允许局域网明文 HTTP (ATS 例外)
        run: |
          PB=/usr/libexec/PlistBuddy
          P=ios/App/App/Info.plist
          $PB -c "Add :NSAppTransportSecurity dict" $P 2>/dev/null || true
          $PB -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" $P 2>/dev/null || \
          $PB -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" $P
          $PB -c "Add :NSLocalNetworkUsageDescription string \"需要访问局域网以连接你电脑上的 OpenHands\"" $P 2>/dev/null || \
          $PB -c "Set :NSLocalNetworkUsageDescription \"需要访问局域网以连接你电脑上的 OpenHands\"" $P
          # iOS 14+ prompts for local network permission; declaring the Bonjour
          # service type makes that prompt fire predictably.
          $PB -c "Add :NSBonjourServices array" $P 2>/dev/null || true
          $PB -c "Add :NSBonjourServices:0 string _http._tcp" $P 2>/dev/null || true
          echo "--- ATS / local network ---"
          $PB -c "Print :NSAppTransportSecurity" $P
          $PB -c "Print :NSLocalNetworkUsageDescription" $P

      - name: 编译（不签名）
        run: |
          set -e
          cd ios/App
          if [ -d App.xcworkspace ]; then
            TARGET="-workspace App.xcworkspace -scheme App"
          else
            TARGET="-project App.xcodeproj -scheme App"
          fi
          xcodebuild $TARGET \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 打包成 ipa
        run: |
          set -e
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "app: $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "OpenHands.ipa" Payload
          cp "OpenHands.ipa" oh-ios.ipa
          ls -lh

      - name: 上传安装包（Actions 附件）
        uses: actions/upload-artifact@v4
        with:
          name: oh-ios-ipa
          path: out/oh-ios.ipa
          if-no-files-found: error

      - name: 发布成公开下载链接（Release）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: OpenHands 远程 v1.0
          body: OpenHands iOS 远程客户端（未签名，配 TrollStore / 巨魔安装）。
          files: out/oh-ios.ipa
          fail_on_unmatched_files: false
